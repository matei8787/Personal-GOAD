---
- name: Install Active Directory Domain Services
  ansible.windows.win_feature:
    name: AD-Domain-Services
    include_management_tools: yes
    state: present

# Path A: The Creator (Explicitly triggered by variable)
- name: Create new Domain Forest
  ansible.windows.win_domain:
    dns_domain_name: "{{ domain_name }}"
    safe_mode_password: "{{ safe_mode_password }}"
    domain_netbios_name: "{{ netbios_name }}"
    install_dns: yes
  register: ad_forest_promotion

- name: Reboot after Promotion
  ansible.windows.win_reboot:
    msg: "Installing AD DS and rebooting..."
    pre_reboot_delay: 15
  when: (ad_forest_promotion.reboot_required | default(false))