---
# 1. Fix DNS (Points to DC1, otherwise it can't find the domain)
- name: Set DNS to DC1
  ansible.windows.win_dns_client:
    adapter_names: '*'
    ipv4_addresses:
      - "{{ dc1_ip }}"     
      - "8.8.8.8"          # Backup for internet

# 2. Flush the cache so Windows forgets the previous failures
- name: Flush DNS Cache
  ansible.windows.win_shell: |
    ipconfig /flushdns
    Start-Sleep -Seconds 5

# 3. NOW verify resolution (This should now succeed)
- name: Debug - Verify Domain Resolution
  ansible.windows.win_shell: |
    Resolve-DnsName -Name "{{ domain_name }}" -Type A | Select-Object -ExpandProperty IPAddress
  register: dns_check
  ignore_errors: yes

- name: Print DNS Resolution
  debug:
    var: dns_check.stdout_lines

# 4. Wait for connectivity from the WINDOWS side (More accurate than localhost)
- name: Verify connectivity to DC1 Port 53 (DNS)
  ansible.windows.win_wait_for:
    host: "{{ dc1_ip }}"
    port: 53
    state: started
    timeout: 60

- name: Verify connectivity to DC1 Port 389 (LDAP)
  ansible.windows.win_wait_for:
    host: "{{ dc1_ip }}"
    port: 389
    state: started
    timeout: 60

# 5. Join Domain
- name: Join Domain
  ansible.windows.win_domain_membership:
    dns_domain_name: "{{ domain_name }}"
    domain_admin_user: "{{ server_user }}@{{ domain_name }}"
    domain_admin_password: "{{ server_password }}"
    state: domain
  register: domain_join

# 6. Reboot if needed
- name: Reboot after Join
  ansible.windows.win_reboot:
  when: domain_join.reboot_required